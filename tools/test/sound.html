<!doctype html>
<!-- Sound check: the ring's voice and every effect (js/sound.js) as buttons, for testing on a
     phone, tablet or the venue's speakers. Open it from the repo root's server: tools/test/sound.html -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sound check</title>
  <style>
    body{ margin: 0; padding: 24px 16px 48px; background: #000; color: #E3D8C3; font: 16px/1.4 -apple-system, system-ui, sans-serif; }
    h1{ margin: 0 0 4px; font-size: 22px; }
    h2{ margin: 28px 0 10px; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: #ED1C24; }
    p{ margin: 0 0 14px; color: #8F877A; font-size: 14px; }
    #state{ color: #ED1C24; }
    .grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    button{ padding: 18px 8px; border: 1px solid #333; border-radius: 10px; background: #111; color: inherit; font: inherit; }
    button:active{ background: #ED1C24; color: #000; }
    button.on{ border-color: #ED1C24; color: #fff; }
    label{ display: block; margin: 0 0 14px; font-size: 14px; color: #8F877A; }
    input{ width: 100%; max-width: 360px; display: block; }
  </style>
</head>
<body>
  <h1>Sound check</h1>
  <p>Tap anything first. Audio: <span id="state">not started</span>. Tablet speakers lose the low end; headphones or the venue speakers show it best.</p>

  <h2>A ring filling</h2>
  <p>Drag slowly, like a hand resting on a letter; at the end it opens.</p>
  <label>Fill <input id="fill" type="range" min="0" max="1" step="0.01" value="0"></label>

  <h2>Effects</h2>
  <label>Pan (left to right of the wall) <input id="pan" type="range" min="0" max="1920" value="960"></label>
  <div class="grid" id="grid"></div>

  <script type="module">
    import { sfx, dwell } from "../../js/sound.js";
    const $ = (id) => document.getElementById(id);
    $("fill").addEventListener("input", (e) => {
      const p = +e.target.value;
      dwell("test", p);
      if (p >= 1){ dwell("test", 0); sfx("open"); e.target.value = 0; }
    });
    $("fill").addEventListener("change", (e) => { if (+e.target.value < 1){ e.target.value = 0; dwell("test", 0); } });
    for (const name of window.athSound.names){
      const b = document.createElement("button");
      b.textContent = name;
      b.addEventListener("click", () => sfx(name, { x: +$("pan").value, v: 1 }));
      $("grid").appendChild(b);
    }
    setInterval(() => {
      const ctx = window.athSound.context;
      $("state").textContent = !ctx ? "not started" : ctx.state + (window.athSound.muted ? ", muted" : "");
    }, 300);
  </script>
</body>
</html>
